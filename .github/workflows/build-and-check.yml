name: C# Build And Checks

on:
    push:
    pull_request:

jobs:
    build-and-check:
        runs-on: ubuntu-latest
        steps:
        - uses: actions/checkout@v6
          with:
            fetch-depth: 0
            fetch-tags: true
        - uses: actions/setup-dotnet@v5
          with:
            dotnet-version: '8.x'
        - run: dotnet build SwarmUI.sln --configuration Release
        - run: dotnet format --verify-no-changes
        - run: dotnet format style --verify-no-changes

    ci-test:
        runs-on: ubuntu-latest
        steps:
        - uses: actions/checkout@v6
          with:
            fetch-depth: 0
            fetch-tags: true
        - uses: actions/setup-dotnet@v5
          with:
            dotnet-version: '8.x'
        - run: ./launch-linux.sh --ci-test true --launch_mode none --loglevel debug

    ci-test-extensions:
        runs-on: ubuntu-latest
        steps:
        - uses: actions/checkout@v6
          with:
            fetch-depth: 0
            fetch-tags: true
        - uses: actions/setup-dotnet@v5
          with:
            dotnet-version: '8.x'
        - run: ./launch-linux.sh --ci-test true --ci-test-extensions true --launch_mode none --loglevel debug

    ecomcraft:
        strategy:
            fail-fast: false
            matrix:
                os: [windows-latest, macos-latest]
        runs-on: ${{ matrix.os }}
        steps:
        - uses: actions/checkout@v6
        - uses: actions/setup-dotnet@v5
          with:
            dotnet-version: '8.x'
        - uses: actions/setup-node@v4
          with:
            node-version: '22'
        # The extension references bin/live_release/SwarmUI.dll (SwarmUI.extension.props), so the main project builds first.
        - run: dotnet build src/SwarmUI.csproj -c Debug -o src/bin/live_release
        - run: dotnet build src/Extensions/EcomCraft/EcomCraft.csproj -c Debug -o ${{ runner.temp }}/ecomcraft-extension
        - run: dotnet test src/Extensions/EcomCraft/Tests/EcomCraft.Tests.csproj
        - run: node --test "src/Extensions/EcomCraft/Tests/*.test.cjs"
