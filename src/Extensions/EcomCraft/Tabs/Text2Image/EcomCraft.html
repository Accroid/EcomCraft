<section id="ecomcraft_diagnostics" class="ecomcraft-workspace" aria-labelledby="ecomcraft_title" hidden>
    <header class="ecomcraft-header">
        <div>
            <p class="ecomcraft-eyebrow">商创工坊 · M0 技术验证</p>
            <h1 id="ecomcraft_title">节点接入诊断</h1>
            <p>先核对配置，再用真实任务验证。这里不会提交生成、连接远程节点或修改设置。</p>
        </div>
        <div class="ecomcraft-actions">
            <button id="ecomcraft_refresh" type="button" class="basic-button" disabled>刷新配置快照</button>
            <button id="ecomcraft_download" type="button" class="basic-button" disabled>下载当前报告</button>
        </div>
    </header>
    <aside class="ecomcraft-notice">
        <strong>诊断不是生产就绪证明。</strong>
        引擎状态可能滞后；刷新时间不是成功心跳，空闲槽位也不表示已获准调度。逐任务策略、归档、素材权限和回滚仍需独立验收。
    </aside>
    <p id="ecomcraft_message" class="ecomcraft-message" role="status" aria-live="polite">等待管理员会话就绪。</p>
    <div id="ecomcraft_results" class="ecomcraft-results"></div>
</section>
